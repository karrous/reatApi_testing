name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run: catches upstream changes to the API even when this repo is idle.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  API_BASE_URL: https://jsonplaceholder.typicode.com

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # Fail fast if the API is down, instead of reporting 100+ unrelated failures.
      - name: Smoke tests
        run: pytest -m smoke
      - name: Full suite
        run: pytest --html=report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.html
